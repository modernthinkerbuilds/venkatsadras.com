name: Build and deploy

# Runs on every push, every morning (to pick up new Substack posts), and on demand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"   # 6:17 am Pacific (13:17 UTC; 5:17 am in winter)
  workflow_dispatch:

permissions:
  contents: write   # save newly synced posts back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync Substack posts and render the lists
        run: python3 scripts/build.py

      - name: Save new posts to the repo
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posts.json writing/index.html index.html
            git commit -m "Sync posts from Substack"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
